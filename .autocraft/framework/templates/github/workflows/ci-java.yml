name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:            # <- required status check name; keep as "ci"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      # 'verify' runs unit tests (surefire) AND integration tests (failsafe, *IT classes), plus packaging.
      - run: mvn -B -ntp verify
      # Add checkstyle/spotless in pom.xml so style violations fail 'verify'.
      - name: Dependency audit (SCA)
        run: mvn -B -ntp org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7
