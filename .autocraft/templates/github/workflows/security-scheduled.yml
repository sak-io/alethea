name: security-scheduled
# Weekly SCA + secrets scan so the security-auditor agent has fresh results to triage.
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  dependency-review-hint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dependabot alerts + CodeQL results are collected by the security-auditor agent (/security-scan)."
