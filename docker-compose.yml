# Alethea sidecar. Usage and threat notes: docs/guides/docker.md
#   export ALETHEA_TOKEN="$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')"
#   docker compose up -d --build
# No default token exists: compose refuses to start while ALETHEA_TOKEN is unset or empty.
services:
  alethea:
    build: .
    image: alethea-sidecar:local
    restart: unless-stopped
    environment:
      ALETHEA_TOKEN: ${ALETHEA_TOKEN:?set ALETHEA_TOKEN (at least 16 bytes); there is no default}
      ALETHEA_CONTAINER: "1"
      ALETHEA_BIND: 0.0.0.0     # inside the container only; the host side is loopback (below)
      ALETHEA_PORT: "47600"
      ALETHEA_HOME: /data
    ports:
      - "127.0.0.1:${ALETHEA_HOST_PORT:-47600}:47600"   # loopback ONLY, never 0.0.0.0
    volumes:
      - alethea-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  alethea-data:
