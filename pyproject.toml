[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alethea"
dynamic = ["version"]
description = "Long-term memory for AI coding agents: local daemon, mnemo CLI, MCP server, Claude Code hooks (stdlib only)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

[project.optional-dependencies]
local = ["fastembed>=0.3"]  # opt-in local ONNX embedder (ALETHEA_EMBEDDER=fastembed:<model>)

[project.urls]
Repository = "https://github.com/sak-io/engram"

[project.scripts]
mnemo = "alethea.cli:main"
alethea-daemon = "alethea.daemon:main"
alethea-hook = "alethea.hooks.alethea_hook:main"
alethea-mcp = "alethea.mcp_server:main"

[tool.setuptools.dynamic]
version = { attr = "alethea.__version__" }

[tool.setuptools.packages.find]
include = ["alethea*"]
